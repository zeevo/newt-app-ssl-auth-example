x-app-env: &app-env
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
  # Better Auth trusts this origin; without it every deployment falls back to
  # localhost:3000 and rejects requests from the real one.
  BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://localhost}
  DATABASE_URL: /data/app.db

services:
  # The only way in. The app trusts the X-DN header it sets, so web must not be
  # reachable except through this proxy.
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - web

  web:
    build:
      context: .
      target: web
    expose:
      - "3000"
    environment:
      <<: *app-env
      DN_HEADER: x-dn
    volumes:
      - db_data:/data
    depends_on:
      migrate:
        condition: service_completed_successfully

  migrate:
    build:
      context: .
      target: migrate
    environment:
      <<: *app-env
    volumes:
      - db_data:/data
    restart: "no"

volumes:
  db_data:
