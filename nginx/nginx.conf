# TLS terminates here. nginx verifies the client certificate against the CA and
# forwards its subject DN to the app, which signs in the matching user.
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate         /etc/nginx/certs/server.crt;
    ssl_certificate_key     /etc/nginx/certs/server.key;
    ssl_client_certificate  /etc/nginx/certs/ca.crt;
    ssl_verify_client       on;

    location / {
        proxy_pass http://web:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # Always overwrite: a client-supplied X-DN must never reach the app.
        proxy_set_header X-DN              $ssl_client_s_dn;
    }
}
